<!--
  Inspirova growth check: the welcome card, the floating launcher and the question funnel behind them.
  src/routes/index.tsx adds this file to the end of the homepage document.
  Every class starts with fx- so nothing here can restyle the rest of the site.
  The settings an owner may want to change are at the top of the first script (CONFIG).
-->
<style>
  @property --fx-a{syntax:"<angle>";inherits:false;initial-value:0deg}
  .fx,.fx-dock{
    --fx-void:#05030D;--fx-panel:rgba(18,11,44,.8);--fx-edge:rgba(168,139,255,.28);
    --fx-violet:#7C5CFF;--fx-lilac:#A88BFF;--fx-ice:#8FD6FF;--fx-coral:#FF8366;--fx-alarm:#FF4D6D;
    --fx-dim:rgba(255,255,255,.74);--fx-faint:rgba(255,255,255,.52);
    --fx-spring:cubic-bezier(.2,1.3,.3,1);--fx-ease:cubic-bezier(.22,.61,.36,1);
    font-family:var(--sans);color:#fff}
  .fx [hidden],.fx[hidden],.fx-dock[hidden]{display:none!important}
  .fx-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  @keyframes fxRot{to{transform:rotate(360deg)}}
  @keyframes fxFade{from{opacity:0}}
  @keyframes fxRise{from{opacity:0;transform:translateY(14px)}}
  .fx-rise{animation:fxRise .5s var(--fx-ease) both;animation-delay:calc(var(--i,0)*80ms)}

  /* ---------- launcher at the bottom of the screen ---------- */
  body.fx-docked footer{padding-bottom:128px}
  body.fx-open{overflow:hidden}
  /* Set on the page itself while the check is open: the site scrolls on its html element, so that is what has to hold still. */
  .fx-lock{overflow-y:hidden}
  /* The site behind the check holds still meanwhile: nothing moves under the blur and nothing is animated unseen. */
  body.fx-open>header *,body.fx-open>main *,body.fx-open>footer *{animation-play-state:paused!important}
  .fx-dock{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;justify-content:center;
    padding:0 12px calc(14px + env(safe-area-inset-bottom));pointer-events:none}
  body.contact-open .fx-dock,body.fx-open .fx-dock{display:none}
  .fx-dock-glow{position:absolute;left:0;right:0;bottom:0;height:230px;
    background:radial-gradient(58% 100% at 50% 100%,rgba(124,92,255,.5) 0%,rgba(124,92,255,.16) 46%,transparent 74%);
    animation:fxBreath 5.5s ease-in-out infinite alternate}
  .fx-dock-glow::before{content:"";position:absolute;inset:0;
    background-image:
      radial-gradient(1.4px 1.4px at 8% 62%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 19% 84%,#fff 50%,transparent 51%),
      radial-gradient(1.6px 1.6px at 31% 48%,#CDBDFF 50%,transparent 51%),radial-gradient(1px 1px at 44% 30%,#fff 50%,transparent 51%),
      radial-gradient(1.4px 1.4px at 58% 44%,#8FD6FF 50%,transparent 51%),radial-gradient(1px 1px at 69% 82%,#fff 50%,transparent 51%),
      radial-gradient(1.6px 1.6px at 81% 52%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 92% 72%,#CDBDFF 50%,transparent 51%);
    -webkit-mask-image:linear-gradient(0deg,#000 30%,transparent 95%);mask-image:linear-gradient(0deg,#000 30%,transparent 95%);
    animation:fxTwinkle 3.2s ease-in-out infinite alternate}
  @keyframes fxBreath{from{opacity:.72}}
  @keyframes fxTwinkle{from{opacity:.4}}
  .fx-dock-rise{position:relative;width:min(640px,100%);animation:fxDockIn 1s .5s var(--fx-spring) both}
  @keyframes fxDockIn{from{opacity:0;transform:translateY(130%) scale(.92)}}
  .fx-dock-card{position:relative;pointer-events:auto;display:flex;align-items:center;border-radius:24px;
    background:linear-gradient(150deg,rgba(42,26,102,.97),rgba(13,8,36,.98) 62%);
    box-shadow:0 22px 70px -20px rgba(124,92,255,.95),0 0 0 1px rgba(168,139,255,.3),inset 0 1px 0 rgba(255,255,255,.12);
    animation:fxHover 5s 1.6s ease-in-out infinite}
  @keyframes fxHover{50%{transform:translateY(-6px)}}
  .fx-dock-card::before{content:"";position:absolute;inset:-1.5px;border-radius:inherit;padding:1.5px;pointer-events:none;
    background:conic-gradient(from var(--fx-a),transparent 0 58%,#A88BFF 72%,#8FD6FF 82%,#FF8366 91%,transparent 100%);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
    animation:fxSweep 4.5s linear infinite}
  @keyframes fxSweep{to{--fx-a:360deg}}
  .fx-dock-main{flex:1;min-width:0;display:flex;align-items:center;gap:13px;padding:11px 8px 11px 13px;background:none;border:0;
    color:#fff;cursor:pointer;text-align:left;border-radius:24px}
  .fx-orb{position:relative;flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
    background:radial-gradient(circle at 35% 30%,rgba(168,139,255,.6),rgba(124,92,255,.14) 72%);box-shadow:0 0 22px rgba(124,92,255,.8)}
  .fx-orb img{width:31px;height:31px;object-fit:contain}
  .fx-orb i{position:absolute;inset:-5px;border-radius:50%;border:1px dashed rgba(255,255,255,.42);animation:fxRot 9s linear infinite}
  .fx-orb i::after{content:"";position:absolute;top:-3.5px;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;
    background:var(--fx-ice);box-shadow:0 0 9px var(--fx-ice)}
  .fx-dock-txt{flex:1;min-width:0;display:grid;gap:1px}
  .fx-dock-txt b{font:700 1.02rem/1.25 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fx-dock-txt small{font-size:.82rem;color:var(--fx-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fx-dock-cta{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 20px;border-radius:999px;
    font-weight:600;font-size:.95rem;background:linear-gradient(120deg,#7C5CFF,#A88BFF 55%,#FF8366);
    box-shadow:0 10px 26px -10px #7C5CFF,inset 0 1px 0 rgba(255,255,255,.3);transition:filter .2s,transform .2s var(--fx-ease)}
  .fx-dock-cta svg{width:15px;height:15px}
  .fx-dock-main:hover .fx-dock-cta{filter:brightness(1.12);transform:translateX(2px)}
  .fx-dock-min{flex:none;width:34px;height:34px;margin:0 9px 0 2px;border-radius:50%;border:0;background:rgba(255,255,255,.08);
    color:rgba(255,255,255,.78);cursor:pointer;display:grid;place-items:center}
  .fx-dock-min:hover{background:rgba(255,255,255,.18);color:#fff}
  .fx-dock-min svg{width:14px;height:14px}
  .fx-dock-mini{display:none;pointer-events:auto;width:62px;height:62px;border-radius:50%;border:0;cursor:pointer;place-items:center;
    background:linear-gradient(150deg,#2A1A66,#0D0824);box-shadow:0 14px 40px -10px #7C5CFF,0 0 0 1px rgba(168,139,255,.42);
    animation:fxRise .4s var(--fx-ease) both}
  .fx-dock[data-state="mini"]{justify-content:flex-end}
  .fx-dock[data-state="mini"] .fx-dock-rise,.fx-dock[data-state="mini"] .fx-dock-glow{display:none}
  .fx-dock[data-state="mini"] .fx-dock-mini{display:grid}
  @media (min-width:900px) and (max-height:820px){
    /* Short laptop screens: sit bottom right, clear of the buttons at the bottom of the first screen. */
    .fx-dock{justify-content:flex-end;padding-right:22px}
    .fx-dock-rise{width:min(470px,100%)}
  }
  @media (max-width:520px){
    .fx-dock{padding-left:8px;padding-right:8px}
    .fx-dock-main{gap:10px;padding:9px 6px 9px 10px}
    .fx-orb{width:40px;height:40px}.fx-orb img{width:27px;height:27px}
    .fx-dock-txt b{font-size:.93rem}.fx-dock-txt small{font-size:.76rem}
    .fx-dock-cta{min-height:40px;padding:0 15px;font-size:.9rem}
    .fx-dock-cta svg{display:none}
    .fx-dock-min{width:30px;height:30px;margin-right:7px}
  }

  /* ---------- full-screen scene ---------- */
  .fx{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;background:var(--fx-void);overflow:hidden;overflow:clip;
    animation:fxFade .35s ease both}
  .fx::before{content:"";position:absolute;inset:-12%;pointer-events:none;
    background:
      radial-gradient(42% 36% at 18% 18%,rgba(124,92,255,.34),transparent 70%),
      radial-gradient(38% 34% at 84% 78%,rgba(255,131,102,.13),transparent 72%),
      radial-gradient(60% 50% at 50% 108%,rgba(99,102,241,.34),transparent 70%),
      radial-gradient(30% 26% at 78% 14%,rgba(143,214,255,.1),transparent 70%);
    animation:fxNebula 38s ease-in-out infinite alternate}
  @keyframes fxNebula{to{transform:scale(1.14) rotate(5deg) translate(1.5%,-1.5%)}}
  .fx-sky{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .fx-flash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:4;
    background:radial-gradient(circle at 50% 46%,#fff 0%,#CDBDFF 22%,rgba(124,92,255,.5) 46%,transparent 72%)}
  .fx-flash.go{animation:fxFlash .95s ease-out both}
  @keyframes fxFlash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
  .fx.fx-alarm::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
    box-shadow:inset 0 0 170px rgba(255,77,109,.5);animation:fxAlarmTint .6s ease-in-out infinite alternate}
  @keyframes fxAlarmTint{from{opacity:.35}}
  .fx-spark{position:absolute;z-index:5;width:7px;height:7px;margin:-3.5px;pointer-events:none;background:#fff;opacity:0;
    clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);
    animation:fxSpark .75s var(--fx-ease) both}
  @keyframes fxSpark{0%{opacity:1;transform:translate(0,0) scale(.4)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(var(--s,1.6)) rotate(140deg)}}

  .fx-top{position:relative;z-index:2;display:flex;align-items:center;gap:12px;
    padding:calc(12px + env(safe-area-inset-top)) 18px 6px}
  .fx-brand{display:flex;align-items:center;gap:9px;font:700 1.02rem var(--display)}
  .fx-brand img{width:28px;height:28px;object-fit:contain}
  .fx-brand em{font:500 .8rem var(--sans);color:var(--fx-faint);padding-left:10px;border-left:1px solid rgba(255,255,255,.2)}
  .fx-count{margin-left:auto;font-size:.82rem;color:var(--fx-dim);font-variant-numeric:tabular-nums}
  .fx-x{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);
    color:#fff;cursor:pointer;display:grid;place-items:center}
  .fx-x:hover{background:rgba(255,255,255,.16)}
  .fx-x svg{width:15px;height:15px}
  .fx-prog{position:relative;z-index:2;display:flex;align-items:center;list-style:none;width:100%;max-width:700px;
    margin:0 auto;padding:10px 26px 4px}
  .fx-prog li{flex:1;height:2px;background:rgba(255,255,255,.16);position:relative;transition:background .4s}
  .fx-prog li:first-child{flex:0 0 0}
  .fx-prog li::after{content:"";position:absolute;right:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:#241A4D;
    border:1px solid rgba(255,255,255,.34);transition:transform .3s var(--fx-spring),background .3s,box-shadow .3s}
  .fx-prog li.lit{background:linear-gradient(90deg,var(--fx-violet),var(--fx-lilac))}
  .fx-prog li.lit::after{background:var(--fx-lilac);border-color:#fff;box-shadow:0 0 10px var(--fx-lilac)}
  .fx-prog li.now::after{background:#fff;box-shadow:0 0 0 4px rgba(168,139,255,.3),0 0 14px #fff;transform:scale(1.3)}

  .fx-view{position:relative;z-index:1;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
    display:flex;flex-direction:column;outline:none;transition:opacity .2s ease,transform .2s ease}
  .fx-view.fx-out{opacity:0;transform:scale(.985)}
  .fx-view[data-screen="plan"],.fx-view[data-screen="book"],.fx-view[data-screen="scan"]{
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 18px);mask-image:linear-gradient(180deg,transparent 0,#000 18px)}
  .fx-view>section{margin:auto;width:100%;max-width:1060px;padding:16px 20px 26px}
  .fx h2{font-family:var(--display);font-weight:700;font-size:clamp(1.45rem,2.7vw,2.05rem);line-height:1.16;letter-spacing:-.02em;
    text-wrap:balance;outline:none}
  .fx-help{margin-top:8px;color:var(--fx-dim);font-size:.96rem}
  .fx-link{background:none;border:0;padding:0;font:inherit;color:#CDBDFF;cursor:pointer;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
  .fx-link:hover{color:#fff}

  .fx-btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:52px;padding:0 28px;border-radius:999px;
    border:0;cursor:pointer;font:600 1rem var(--sans);color:#fff;text-decoration:none;
    background:linear-gradient(120deg,#7C5CFF 0%,#A88BFF 50%,#FF8366 100%);background-size:180% 100%;background-position:0 50%;
    box-shadow:0 14px 40px -12px rgba(124,92,255,.95),inset 0 1px 0 rgba(255,255,255,.3);
    transition:transform .2s var(--fx-ease),background-position .5s var(--fx-ease),opacity .2s,box-shadow .3s}
  .fx-btn:hover{transform:translateY(-2px);background-position:100% 50%}
  .fx-btn:active{transform:none}
  .fx-btn[disabled]{opacity:.36;cursor:not-allowed;transform:none;box-shadow:none}
  .fx-btn.fx-ghost{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.22);box-shadow:none}
  .fx-btn.fx-ghost:hover{background:rgba(255,255,255,.13)}

  /* ---------- opening cutscene and launch pass ---------- */
  .fx-view>section.fx-intro{position:relative;flex:1;margin:0;max-width:none;display:grid;place-items:center;padding:8px 18px 30px}
  .fx-ign{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
  .fx-ign-in{display:grid;justify-items:center;gap:24px}
  .fx-ign-logo{width:min(46vw,230px);
    filter:drop-shadow(0 0 30px rgba(124,92,255,.9)) drop-shadow(0 0 80px rgba(143,214,255,.5));
    animation:fxIgnite 1.15s var(--fx-spring) both}
  @keyframes fxIgnite{from{opacity:0;transform:scale(.25) rotate(-28deg);filter:blur(12px) brightness(4)}}
  .fx-ign-word{font:800 clamp(1.45rem,5vw,2.5rem) var(--display);letter-spacing:.42em;padding-left:.42em;
    animation:fxWord 1.3s .3s var(--fx-ease) both}
  @keyframes fxWord{from{opacity:0;letter-spacing:1.1em;filter:blur(6px)}}
  .fx-ign-ring{position:absolute;left:50%;top:50%;width:min(76vw,440px);aspect-ratio:1;border-radius:50%;opacity:0;
    border:1.5px solid rgba(168,139,255,.6);transform:translate(-50%,-50%)}
  [data-phase="1"] .fx-ign-ring{animation:fxCharge .95s ease-in both}
  [data-phase="1"] .fx-ign-ring.r2{animation-delay:.22s;border-color:rgba(143,214,255,.6)}
  @keyframes fxCharge{0%{opacity:0;transform:translate(-50%,-50%) scale(1.9)}30%{opacity:.95}100%{opacity:0;transform:translate(-50%,-50%) scale(.04)}}
  [data-phase="1"] .fx-ign-in{animation:fxPull 1.05s ease-in both}
  @keyframes fxPull{to{transform:scale(.5);filter:brightness(2.6) blur(2px)}}
  [data-phase="2"] .fx-ign,[data-phase="3"] .fx-ign{display:none}
  .fx-pass-anim{display:none;width:min(450px,100%)}
  [data-phase="2"] .fx-pass-anim,[data-phase="3"] .fx-pass-anim{display:block;animation:fxUnfold 1s var(--fx-spring) both}
  @keyframes fxUnfold{0%{opacity:0;transform:perspective(1000px) rotateX(80deg) scale(.35) translateY(60px);filter:blur(8px) brightness(3)}
    55%{opacity:1;filter:blur(0) brightness(1.5)}}
  .fx-intro .fx-pass-anim.out{animation:fxFly .4s ease-in both;pointer-events:none}
  @keyframes fxFly{to{opacity:0;transform:scale(2.3);filter:blur(7px)}}
  .fx-pass{position:relative;text-align:left;border-radius:26px;padding:22px 22px 20px;overflow:hidden;
    background:linear-gradient(155deg,rgba(44,28,104,.94) 0%,rgba(16,10,44,.96) 55%,rgba(34,18,78,.96) 100%);
    border:1px solid rgba(168,139,255,.42);
    box-shadow:0 44px 130px -44px rgba(124,92,255,1),inset 0 0 0 1px rgba(255,255,255,.05);
    transform:perspective(1000px) rotateX(var(--fx-rx,0deg)) rotateY(var(--fx-ry,0deg));transition:transform .18s ease-out}
  .fx-pass::before{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;
    background:linear-gradient(115deg,transparent 30%,rgba(143,214,255,.2) 44%,rgba(255,255,255,.36) 50%,rgba(255,131,102,.18) 56%,transparent 70%);
    background-size:260% 100%;background-position:-70% 0;animation:fxSheen 4.4s 1s ease-in-out infinite}
  @keyframes fxSheen{0%{background-position:130% 0}55%,100%{background-position:-70% 0}}
  .fx-pass::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(280px circle at var(--fx-gx,50%) var(--fx-gy,-10%),rgba(168,139,255,.3),transparent 62%)}
  .fx-pass>*{position:relative;z-index:1}
  .fx-pass-top{display:flex;align-items:center;gap:10px}
  .fx-pass-top img{width:34px;height:34px;object-fit:contain}
  .fx-pass-top b{font:700 .95rem var(--display);letter-spacing:.22em}
  .fx-pass-top span{margin-left:auto;font:600 .66rem var(--mono);letter-spacing:.12em;color:var(--fx-ice);
    border:1px solid rgba(143,214,255,.42);border-radius:999px;padding:4px 10px;white-space:nowrap}
  .fx-pass h2{margin-top:18px;font-weight:800;font-size:clamp(1.7rem,6.4vw,2.3rem);line-height:1.08;letter-spacing:-.03em}
  .fx-pass p{margin-top:10px;color:var(--fx-dim);font-size:.97rem}
  .fx-perf{margin:18px -22px 14px;height:1px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.36) 0 6px,transparent 6px 12px)}
  .fx-perf::before,.fx-perf::after{content:"";position:absolute;top:-10px;width:20px;height:20px;border-radius:50%;
    background:var(--fx-void);border:1px solid rgba(168,139,255,.42)}
  .fx-perf::before{left:-11px}.fx-perf::after{right:-11px}
  .fx-pass dl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .fx-pass dt{font:600 .62rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fx-faint)}
  .fx-pass dd{font:700 1.05rem var(--display);margin-top:2px}
  .fx-load{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;margin-top:18px;min-height:52px;align-content:center}
  .fx-load-bar{grid-column:1/-1;height:8px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden}
  .fx-load-bar i{display:block;height:100%;width:0;border-radius:inherit;
    background:linear-gradient(90deg,var(--fx-violet),var(--fx-ice));box-shadow:0 0 14px rgba(143,214,255,.8);transition:width .12s linear}
  .fx-load span{font-size:.85rem;color:var(--fx-dim)}
  .fx-load b{font:700 .85rem var(--mono);color:#fff}
  .fx-begin{width:100%;margin-top:18px;animation:fxBegin .5s var(--fx-spring) both,fxBeat 1.6s .5s ease-in-out infinite}
  @keyframes fxBegin{from{opacity:0;transform:scale(.8)}}
  @keyframes fxBeat{50%{box-shadow:0 14px 60px -6px #A88BFF,inset 0 1px 0 rgba(255,255,255,.3)}}
  .fx-skip{position:absolute;right:18px;bottom:calc(14px + env(safe-area-inset-bottom));background:none;border:0;
    color:var(--fx-faint);font:500 .85rem var(--sans);cursor:pointer;padding:10px;text-decoration:underline;text-underline-offset:3px}
  .fx-skip:hover{color:#fff}
  [data-phase="3"] .fx-skip{display:none}

  /* ---------- questions ---------- */
  .fx-q{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center}
  .fx-stage{order:2;position:relative;border-radius:28px;border:1px solid var(--fx-edge);overflow:hidden;aspect-ratio:16/10.4;
    background:linear-gradient(180deg,rgba(124,92,255,.12),rgba(12,8,32,.6));
    box-shadow:inset 0 0 70px rgba(124,92,255,.16),0 34px 90px -44px rgba(124,92,255,.85)}
  .fx-opts{display:grid;gap:10px;margin-top:20px}
  .fx-opts.two{grid-template-columns:1fr 1fr}
  .fx-opt{position:relative;display:flex;align-items:center;gap:12px;min-height:58px;padding:9px 12px 9px 12px;border-radius:17px;
    text-align:left;cursor:pointer;color:#fff;overflow:hidden;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);
    transition:border-color .2s,background .2s,transform .2s var(--fx-ease),box-shadow .3s}
  .fx-opt:hover{border-color:rgba(168,139,255,.65);background:rgba(124,92,255,.13);transform:translateY(-1px)}
  .fx-opt[aria-checked="true"]{border-color:var(--fx-lilac);
    background:linear-gradient(120deg,rgba(124,92,255,.4),rgba(124,92,255,.15));
    box-shadow:0 0 0 1px var(--fx-lilac),0 16px 38px -18px #7C5CFF}
  .fx-opt.span{grid-column:1/-1}
  .fx-ic{flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:rgba(124,92,255,.24);
    color:#CDBDFF;font:700 .72rem var(--mono);transition:background .2s,color .2s}
  .fx-opt[aria-checked="true"] .fx-ic{background:linear-gradient(140deg,#7C5CFF,#A88BFF);color:#fff}
  .fx-ic svg{width:19px;height:19px}
  .fx-ol{flex:1;min-width:0}
  .fx-ol b{display:block;font-weight:600;font-size:.97rem;line-height:1.25}
  .fx-ol small{display:block;margin-top:2px;font-size:.8rem;color:var(--fx-faint);line-height:1.3}
  .fx-tick{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(255,255,255,.3);display:grid;place-items:center;
    transition:background .2s,border-color .2s,transform .3s var(--fx-spring)}
  .fx-opt[role="checkbox"] .fx-tick{border-radius:7px}
  .fx-tick svg{width:12px;height:12px;opacity:0;transition:opacity .15s}
  .fx-opt[aria-checked="true"] .fx-tick{background:#fff;border-color:#fff;color:#3B1FA8;transform:scale(1.12)}
  .fx-opt[aria-checked="true"] .fx-tick svg{opacity:1}
  .fx-opt.hit::after{content:"";position:absolute;left:var(--px,50%);top:var(--py,50%);width:14px;height:14px;margin:-7px;border-radius:50%;
    background:rgba(255,255,255,.55);pointer-events:none;animation:fxRipple .6s ease-out both}
  @keyframes fxRipple{to{transform:scale(34);opacity:0}}
  .fx-text{width:100%;margin-top:20px;font:600 1.15rem var(--sans);color:#fff;background:rgba(8,6,15,.6);
    border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:16px 18px}
  .fx-text:focus,.fx-form input:focus,.fx-form textarea:focus{outline:none;border-color:var(--fx-lilac);box-shadow:0 0 0 3px rgba(124,92,255,.32)}
  .fx-text::placeholder{color:rgba(255,255,255,.36);font-weight:500}
  .fx-say{display:flex;gap:10px;align-items:flex-start;min-height:3em;margin-top:14px;font-size:.96rem;line-height:1.45}
  .fx-say::before{content:"";flex:none;width:8px;height:8px;margin-top:.45em;border-radius:50%;background:var(--fx-ice);box-shadow:0 0 10px var(--fx-ice)}
  .fx-say:empty::before{display:none}
  .fx-say.new{animation:fxRise .4s var(--fx-ease) both}
  .fx-nav{display:flex;gap:10px;align-items:center;margin-top:14px}
  .fx-nav .fx-btn{flex:1}
  .fx-nav .fx-back{flex:none;padding:0 22px}
  .fx-nav .fx-btn:not([disabled]):not(.fx-ghost){animation:fxBeat 1.8s ease-in-out infinite}

  /* ---------- drawings inside the question stage ---------- */
  .fx-svg{display:block;width:100%;height:100%}
  .fx-svg text{font-family:var(--sans);font-size:11px;fill:rgba(255,255,255,.82)}
  .fx-svg .s-b{font-weight:700;fill:#fff;font-size:12px}
  .fx-svg .s-m{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;fill:var(--fx-ice)}
  .fx-svg .s-big{font-family:var(--display);font-size:15px}
  .fx-svg .s-q{font-size:26px;fill:rgba(255,255,255,.34)}
  .fx-svg .s-line{fill:none;stroke:rgba(168,139,255,.5);stroke-width:1.2}
  .fx-svg .s-dash{fill:none;stroke:rgba(255,255,255,.3);stroke-width:1;stroke-dasharray:3 5}
  .fx-svg .s-hot{fill:none;stroke:var(--fx-ice);stroke-width:1.5}
  .fx-svg .s-glow{fill:rgba(124,92,255,.3)}
  .fx-svg .s-chip{fill:rgba(124,92,255,.42);stroke:var(--fx-lilac);stroke-width:1}
  .fx-svg .s-off{opacity:.5}
  .fx-svg .s-fillv{fill:url(#fxgBar)}
  .fx-svg .s-fillv.best{fill:url(#fxgHot)}
  .fx-svg .s-fillh{fill:url(#fxgAcross)}
  .fx-svg .s-pop{transform-box:fill-box;transform-origin:center;animation:fxPop .5s var(--fx-spring) both;animation-delay:calc(var(--i,0)*90ms)}
  @keyframes fxPop{from{opacity:0;transform:scale(.2)}}
  .fx-svg .s-spin{animation:fxRot 14s linear infinite}
  .fx-svg .s-draw{stroke-dasharray:1;animation:fxDraw 1.3s var(--fx-ease) both}
  @keyframes fxDraw{from{stroke-dashoffset:1}}
  .fx-svg .s-flow{stroke-dasharray:3 6;animation:fxFlow .7s linear infinite}
  @keyframes fxFlow{to{stroke-dashoffset:-9}}
  .fx-svg .s-rip{fill:none;stroke:var(--fx-ice);stroke-width:1;transform-box:fill-box;transform-origin:center;
    animation:fxRing 1.9s ease-out infinite;animation-delay:calc(var(--i,0)*90ms)}
  @keyframes fxRing{from{transform:scale(.3);opacity:.95}to{transform:scale(2.3);opacity:0}}
  .fx-svg .s-grow{transform-box:fill-box;transform-origin:bottom;animation:fxGrow .9s var(--fx-ease) both;animation-delay:calc(var(--i,0)*120ms)}
  @keyframes fxGrow{from{transform:scaleY(0)}}
  .fx-svg .s-growx{transform-box:fill-box;transform-origin:left;animation:fxGrowX 1s var(--fx-ease) both}
  @keyframes fxGrowX{from{transform:scaleX(0)}}
  .fx-svg .s-ret{transform:translate(96px,112px);animation:fxSeek 5s ease-in-out infinite alternate}
  @keyframes fxSeek{0%{transform:translate(78px,124px)}50%{transform:translate(214px,62px)}100%{transform:translate(110px,132px)}}
  .fx-svg .s-ret.lock{transform:translate(160px,84px);animation:fxLock .7s var(--fx-spring) both}
  @keyframes fxLock{from{transform:translate(96px,124px) scale(1.9);opacity:.3}}
  .fx-svg .s-sig{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;stroke:var(--fx-ice);
    filter:drop-shadow(0 0 6px rgba(143,214,255,.85))}
  .fx-svg .s-sig.weak{stroke:var(--fx-lilac)}
  .fx-svg .s-sig.stopped,.fx-svg .s-sig.never{stroke:var(--fx-coral);filter:none}
  .fx-svg .s-dot{animation:fxGo 2.2s ease-in-out infinite}
  .fx-svg .s-dot.clicks{animation-name:fxGoHalf}
  .fx-svg .s-dot.no{animation-name:fxGoNone}
  @keyframes fxGo{0%{transform:translateX(0);opacity:0}10%,88%{opacity:1}100%{transform:translateX(216px);opacity:0}}
  @keyframes fxGoHalf{0%{transform:translateX(0);opacity:0}10%,70%{opacity:1}100%{transform:translateX(118px);opacity:0}}
  @keyframes fxGoNone{0%{transform:translateX(0);opacity:0}10%,40%{opacity:1}100%{transform:translateX(44px);opacity:0}}
  .fx-svg .s-coin{fill:rgba(124,92,255,.34);stroke:var(--fx-lilac);stroke-width:1.4}
  .fx-svg .s-eur{font-size:15px}
  .fx-svg .s-kept .s-coin{stroke:var(--fx-ice)}
  .fx-svg .s-gone .s-coin,.fx-svg .s-gone .s-eur{opacity:.2;animation:fxDim .8s ease both;animation-delay:calc(var(--i,0)*110ms)}
  @keyframes fxDim{from{opacity:1}}

  /* ---------- building the plan ---------- */
  .fx-scan{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.8fr);gap:44px;align-items:center}
  .fx-view>section.fx-scan{padding-top:20px}
  .fx-radar{position:relative;width:112px;aspect-ratio:1;border-radius:50%;margin-bottom:18px;border:1px solid var(--fx-edge);
    background:radial-gradient(circle,rgba(124,92,255,.3),transparent 70%)}
  .fx-radar::before{content:"";position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 0deg,rgba(143,214,255,.6),transparent 30%);animation:fxRot 1.5s linear infinite}
  .fx-radar::after{content:"";position:absolute;inset:20%;border-radius:50%;border:1px dashed rgba(255,255,255,.34)}
  .fx-radar img{position:absolute;inset:27%;width:46%;height:46%;object-fit:contain;z-index:1}
  .fx-pct{font:700 .6em var(--mono);color:var(--fx-ice);margin-left:8px;vertical-align:.12em}
  .fx-log{list-style:none;display:grid;gap:11px;margin-top:20px}
  .fx-log li{display:grid;grid-template-columns:22px 1fr;gap:11px;align-items:start;opacity:.34;transition:opacity .3s}
  .fx-log li.on,.fx-log li.ok{opacity:1}
  .fx-log i{width:20px;height:20px;margin-top:2px;border-radius:50%;border:2px solid rgba(255,255,255,.28);display:grid;place-items:center}
  .fx-log li.on i{border-color:var(--fx-lilac);border-top-color:transparent;animation:fxRot .7s linear infinite}
  .fx-log li.ok i{border-color:var(--fx-ice);background:var(--fx-ice)}
  .fx-log li.ok i::after{content:"";width:9px;height:5px;margin-top:-2px;border-left:2px solid #0C0820;border-bottom:2px solid #0C0820;transform:rotate(-45deg)}
  .fx-log span{font-size:.97rem;font-weight:500}
  .fx-log code{display:block;min-height:1.35em;margin-top:1px;font:500 .8rem var(--mono);color:var(--fx-ice)}
  .fx-ad{position:relative;width:min(300px,100%);margin:0 auto;border-radius:22px;background:#fff;color:#14102A;overflow:hidden;
    box-shadow:0 44px 100px -44px #7C5CFF,0 0 0 1px rgba(255,255,255,.1)}
  .fx-ad-tag{position:absolute;top:10px;right:10px;z-index:2;font:700 .6rem var(--mono);letter-spacing:.1em;text-transform:uppercase;
    background:#14102A;color:#fff;border-radius:999px;padding:5px 9px}
  .fx-ad-head{display:flex;align-items:center;gap:9px;padding:11px 12px}
  .fx-ad-av{flex:none;width:32px;height:32px;border-radius:50%;background:linear-gradient(140deg,#7C5CFF,#FF8366);color:#fff;
    display:grid;place-items:center;font:700 .85rem var(--display)}
  .fx-ad-head b{display:block;font-size:.85rem;line-height:1.2;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fx-ad-head small{font-size:.7rem;color:#6B6880}
  .fx-ad canvas{display:block;width:100%;aspect-ratio:16/10;background:#1B0F4A}
  .fx-ad-body{padding:12px 12px 14px}
  .fx-ad-body h3{font:700 1rem/1.25 var(--display);min-height:1.25em}
  .fx-ad-body p{font-size:.82rem;color:#4A4760;margin-top:4px}
  .fx-ad-cta{display:inline-block;margin-top:10px;background:#14102A;color:#fff;border-radius:10px;padding:8px 14px;font:600 .8rem var(--sans)}
  .fx-ad.wait canvas{background:linear-gradient(100deg,#1B0F4A 30%,#3B1D8F 50%,#1B0F4A 70%);background-size:220% 100%;animation:fxShimmer 1.1s linear infinite}
  .fx-ad.wait .fx-ad-body>*{visibility:hidden}
  @keyframes fxShimmer{from{background-position:120% 0}to{background-position:-100% 0}}

  /* ---------- plan, price and the error ---------- */
  .fx-view>section.fx-plan{max-width:900px;display:grid;gap:16px;padding-top:20px}
  .fx-plan-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:22px;align-items:center}
  .fx-card{border-radius:22px;border:1px solid var(--fx-edge);background:var(--fx-panel)}
  .fx-plan-card{padding:4px 18px}
  .fx-plan-card div{display:grid;grid-template-columns:88px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.09)}
  .fx-plan-card div:last-child{border:0}
  .fx-plan-card dt{font-size:.82rem;color:var(--fx-faint);padding-top:1px}
  .fx-plan-card dd{font-size:.96rem;font-weight:500;line-height:1.4}
  .fx-ticket{position:relative;padding:18px;border-radius:22px;border:1px solid var(--fx-edge);overflow:hidden;
    background:linear-gradient(160deg,rgba(38,23,90,.94),rgba(14,9,38,.95));transition:border-color .3s,box-shadow .5s}
  .fx-ticket-main{display:flex;align-items:center;gap:14px}
  .fx-ticket-main>div:first-child{min-width:0}
  .fx-ticket-k{display:block;font-size:.8rem;color:var(--fx-faint)}
  .fx-ticket-main b{display:block;font:700 1.12rem/1.25 var(--display)}
  .fx-ticket-main small+b{margin-top:1px}
  .fx-ticket-d{display:block;margin-top:3px;font-size:.86rem;color:var(--fx-dim)}
  .fx-price{margin-left:auto;display:flex;align-items:baseline;gap:9px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .fx-was{display:none;font:600 1rem var(--sans);color:var(--fx-faint)}
  .fx-now{font:800 clamp(2rem,7.4vw,2.9rem)/1 var(--display);letter-spacing:-.02em}
  .fx-now.roll{filter:blur(1.2px);color:var(--fx-ice)}
  .fx-disc{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin-top:16px;font-size:.86rem;color:var(--fx-dim)}
  .fx-disc-bar{position:relative;height:10px;border-radius:999px;background:rgba(255,255,255,.11)}
  .fx-disc-bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:inherit;
    background:linear-gradient(90deg,var(--fx-violet),var(--fx-ice));box-shadow:0 0 14px rgba(143,214,255,.75);transition:width .08s linear}
  .fx-disc-bar i.over{background:linear-gradient(90deg,var(--fx-coral),var(--fx-alarm));box-shadow:0 0 20px var(--fx-alarm)}
  .fx-disc b{font:700 .95rem var(--mono);color:#fff;min-width:4.4ch;text-align:right}
  .fx-ticket[data-state="err"]{border-color:var(--fx-alarm);box-shadow:0 0 0 1px var(--fx-alarm),0 30px 90px -40px var(--fx-alarm);
    animation:fxShake .45s linear 3}
  @keyframes fxShake{0%,100%{transform:none}20%{transform:translate(-7px,2px) skewX(-2deg)}40%{transform:translate(6px,-2px)}
    60%{transform:translate(-4px,1px) skewX(2deg)}80%{transform:translate(4px,0)}}
  .fx-ticket[data-state="err"]::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(255,77,109,.16) 0 2px,transparent 2px 5px);animation:fxLines .3s linear infinite}
  @keyframes fxLines{to{background-position:0 5px}}
  .fx-ticket[data-state="err"] .fx-now{animation:fxGlitch .32s steps(2) infinite}
  @keyframes fxGlitch{0%{text-shadow:3px 0 var(--fx-alarm),-3px 0 var(--fx-ice);transform:translate(1px,-1px)}
    50%{text-shadow:-3px 0 var(--fx-alarm),3px 0 var(--fx-ice);transform:translate(-2px,1px) skewX(7deg)}
    100%{text-shadow:2px 1px var(--fx-alarm),-2px -1px var(--fx-ice)}}
  .fx-ticket[data-state="err"] .fx-disc b{color:#FF9DB0}
  .fx-err{position:relative;display:flex;align-items:center;gap:12px;width:100%;margin-top:16px;padding:13px 14px;border-radius:17px;
    text-align:left;cursor:pointer;color:#fff;background:linear-gradient(120deg,rgba(255,77,109,.3),rgba(255,131,102,.16));
    border:1.5px solid var(--fx-alarm);animation:fxSiren 1.1s ease-out infinite}
  @keyframes fxSiren{from{box-shadow:0 0 0 0 rgba(255,77,109,.65)}to{box-shadow:0 0 0 16px rgba(255,77,109,0)}}
  .fx-err-ic{flex:none;width:38px;height:38px;border-radius:11px;background:var(--fx-alarm);color:#fff;display:grid;place-items:center;
    font:800 1.3rem var(--display)}
  .fx-err-t{flex:1;min-width:0}
  .fx-err-t b{display:block;font:700 .8rem var(--mono);letter-spacing:.08em;color:#FFC2CD}
  .fx-err-t span{display:block;margin-top:2px;font-size:.9rem;line-height:1.35}
  .fx-err em{flex:none;font:700 .88rem var(--sans);background:#fff;color:#3A0A18;border-radius:999px;padding:10px 15px;white-space:nowrap}
  .fx-ticket[data-state="free"]{border-color:var(--fx-ice);box-shadow:0 0 0 1px var(--fx-ice),0 34px 100px -44px var(--fx-ice)}
  .fx-ticket[data-state="free"] .fx-disc{display:none}
  .fx-ticket[data-state="free"] .fx-was{display:inline;text-decoration:line-through}
  .fx-ticket[data-state="free"] .fx-now{color:var(--fx-ice)}
  .fx-free{display:flex;flex-wrap:wrap;align-items:center;gap:14px 16px;margin-top:16px;padding-top:16px;border-top:1px dashed rgba(143,214,255,.4)}
  .fx-stamp{flex:none;font:800 1.15rem var(--display);letter-spacing:.18em;color:var(--fx-ice);border:2.5px solid var(--fx-ice);
    border-radius:10px;padding:5px 10px 5px 13px;transform:rotate(-7deg);animation:fxStamp .5s var(--fx-spring) both}
  @keyframes fxStamp{from{opacity:0;transform:rotate(-20deg) scale(2.8)}}
  .fx-free p{flex:1;min-width:210px;font-size:.93rem;color:var(--fx-dim)}
  .fx-free p b{display:block;font:700 1.15rem/1.3 var(--display);color:#fff}

  /* ---------- pick a day ---------- */
  .fx-view>section.fx-book{max-width:1000px;padding-top:20px}
  .fx-book-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 40px;align-items:start;margin-top:6px}
  .fx-days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:18px}
  .fx-day,.fx-slot{cursor:pointer;color:#fff;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);
    transition:border-color .2s,background .2s,transform .2s var(--fx-ease),box-shadow .3s}
  .fx-day{display:grid;justify-items:center;padding:9px 4px;border-radius:16px}
  .fx-day small{font-size:.74rem;color:var(--fx-dim)}
  .fx-day b{font:700 1.4rem/1.15 var(--display)}
  .fx-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .fx-slot{min-height:46px;border-radius:14px;font:600 .93rem var(--sans)}
  .fx-day:hover,.fx-slot:hover{border-color:rgba(168,139,255,.65);background:rgba(124,92,255,.13);transform:translateY(-1px)}
  .fx-day[aria-checked="true"],.fx-slot[aria-checked="true"]{border-color:var(--fx-lilac);
    background:linear-gradient(140deg,rgba(124,92,255,.6),rgba(124,92,255,.22));box-shadow:0 14px 32px -16px #7C5CFF}
  .fx-label{margin-top:18px;font-size:.84rem;color:var(--fx-dim)}
  .fx-pickline{min-height:1.5em;margin-top:14px;font-size:.95rem;font-weight:500;color:var(--fx-ice)}
  .fx-label+.fx-days,.fx-label+.fx-slots{margin-top:8px}
  .fx-form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;padding:18px;border-radius:22px;border:1px solid var(--fx-edge);background:var(--fx-panel)}
  .fx-form label{display:grid;gap:6px;font-size:.84rem;color:var(--fx-dim)}
  .fx-form label em{font-style:normal;color:var(--fx-faint)}
  .fx-form input:not([type="checkbox"]),.fx-form textarea{width:100%;font:500 1rem var(--sans);color:#fff;background:rgba(8,6,15,.62);
    border:1px solid rgba(255,255,255,.2);border-radius:13px;padding:12px 14px}
  .fx-form textarea{resize:vertical;min-height:52px}
  .fx-form .fx-wide,.fx-form .fx-msg,.fx-form .fx-btn{grid-column:1/-1}
  .fx-form label.fx-check{grid-column:1/-1;display:flex;gap:10px;align-items:flex-start;color:#fff;font-size:.9rem;cursor:pointer}
  .fx-check input{flex:none;width:20px;height:20px;margin-top:1px;accent-color:var(--fx-violet)}
  .fx-check a{color:#CDBDFF;text-decoration:underline;text-underline-offset:2px}
  .fx-msg{min-height:1.4em;font-size:.9rem;color:#FFB3A3}

  /* ---------- sent ---------- */
  .fx-view>section.fx-done{max-width:560px;text-align:center}
  .fx-done-orb{position:relative;width:132px;aspect-ratio:1;margin:0 auto 22px;display:grid;place-items:center}
  .fx-done-orb img{width:128px;max-width:none;filter:drop-shadow(0 0 26px rgba(143,214,255,.9));animation:fxIgnite 1s var(--fx-spring) both}
  .fx-done-orb i{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(143,214,255,.6);animation:fxRing 2.2s ease-out infinite}
  .fx-done-orb i+i{animation-delay:1.1s}
  .fx-done h2{font-size:clamp(1.8rem,6vw,2.6rem);font-weight:800}
  .fx-done p{margin-top:12px;font-size:1.02rem}
  .fx-done-act{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:26px}

  /* ---------- welcome card: comes up as a visitor opens the site, and when they press "Request your quote" ---------- */
  .fx{transition:background-color .5s ease}
  .fx.fx-hello{background:rgba(5,3,13,.78);-webkit-backdrop-filter:blur(10px) saturate(1.2);backdrop-filter:blur(10px) saturate(1.2)}
  .fx.fx-hello .fx-top{display:none}
  .fx.fx-hello.fx-dark{background:var(--fx-void)}
  .fx-view>section.fx-hi{max-width:1010px;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
  /* Arrival and leaving move and fade only, with no blur, so a card this size stays smooth on a slow phone. */
  .fx-hi-in{position:relative;animation:fxHiIn .95s var(--fx-spring) both}
  @keyframes fxHiIn{0%{opacity:0;transform:perspective(1200px) rotateX(42deg) scale(.55) translateY(80px)}45%{opacity:1}}
  .fx-hi-in::after{content:"";position:absolute;inset:0;border-radius:32px;pointer-events:none;opacity:0;
    background:linear-gradient(135deg,#fff,#CDBDFF);animation:fxHiFlash .8s ease-out both}
  @keyframes fxHiFlash{0%{opacity:.7}100%{opacity:0}}
  .fx-hi-in.out{animation:fxHiOut .4s ease-in both;pointer-events:none}
  .fx-hi-in.out::after{animation:none}
  @keyframes fxHiOut{to{opacity:0;transform:scale(1.9)}}
  .fx-hi-card{position:relative;display:grid;grid-template-columns:minmax(0,.84fr) minmax(0,1fr);min-height:clamp(450px,58vh,580px);
    border-radius:32px;text-align:left;
    background:linear-gradient(150deg,rgba(46,29,110,.97) 0%,rgba(15,9,42,.985) 52%,rgba(30,16,72,.985) 100%);
    box-shadow:0 70px 170px -50px rgba(124,92,255,1),0 0 0 1px rgba(168,139,255,.34),inset 0 1px 0 rgba(255,255,255,.1);
    transform:perspective(1400px) rotateX(var(--fx-rx,0deg)) rotateY(var(--fx-ry,0deg));transition:transform .18s ease-out}

      .then(function (res) { return res.json().catch(function () { return {}; }).then(function (j) { return { ok: res.ok, j: j || {} }; }); })
      .then(function (res) {
        if (mine !== token) return;
        if (!res.ok) { msg.textContent = res.j.error || "Your request could not be sent. Please try again."; return; }
        st.done = { first: data.name, email: data.email, when: F.whenShort(st.day, st.slot) };
        st.f = {}; save(); go("done");
      })
      .catch(function () { if (mine === token) msg.textContent = "Network error. Please e-mail " + CFG.fallbackEmail + "."; })
      .then(function () {
        busy = false;
        if (mine === token && btn.parentNode) { btn.disabled = false; btn.textContent = "Request my free call"; }
      });
  }
  function renderDone() {
    var d = st.done || {};
    view.innerHTML = '<section class="fx-done"><div class="fx-done-orb" aria-hidden="true"><i></i><i></i><img src="' + esc(LOGO) + '" alt=""></div>' +
      '<h2 id="fxTitle">We have lift-off' + (d.first ? ", " + esc(d.first) : "") + ".</h2>" +
      "<p>Your call request is in" + (d.when ? ": <b>" + esc(d.when) + "</b>" : "") + ".</p>" +
      '<p class="fx-help">' + esc(CFG.host) + " will e-mail " + (d.email ? "<b>" + esc(d.email) + "</b>" : "you") + " to confirm the exact time.</p>" +
      '<div class="fx-done-act"><button type="button" class="fx-btn" data-fx="close">Back to the site</button>' +
      '<a class="fx-btn fx-ghost" href="/results" target="_top">See client results</a></div></section>';
    sky.nova(); sparks(view.querySelector(".fx-done-orb"), 30, 230); buzz([20, 40, 20]);
  }
  var SCREENS = { hello: renderHello, intro: renderIntro, q: renderQ, scan: renderScan, plan: renderPlan, book: renderBook, done: renderDone };

  /* ---- open, close, launcher ---- */
  function paintDock() {
    var started = F.begun(st), title, sub, cta;
    if (st.done) { title = "Call requested"; sub = CFG.host + " confirms by e-mail."; cta = "View"; }
    else if (started) { title = "Continue your growth check"; sub = st.i >= Q.length ? "Your plan is ready" : "Question " + (st.i + 1) + " of " + Q.length; cta = "Continue"; }
    else { title = "Get your free growth plan"; sub = Q.length + " questions, 2 minutes"; cta = "Start"; }
    document.getElementById("fxDockTitle").textContent = title;
    document.getElementById("fxDockSub").textContent = sub;
    document.getElementById("fxDockCta").textContent = cta;
    dock.setAttribute("data-state", st.mini || yielding > 0 ? "mini" : "open");
  }
  function resume() { return st.done ? "done" : !st.seen ? "intro" : st.i >= Q.length ? (st.won ? "book" : "plan") : "q"; }
  /* by "enter" (the page has just opened) or "quote" (the site's quote button): the welcome card comes first.
     Anything else, such as the launcher's own button, goes straight into the check. */
  function open(by) {
    if (!root.hidden) return;
    var card = (by === "enter" || by === "quote") && !st.done;
    lastFocus = document.activeElement;
    dock.hidden = false; root.hidden = false; document.body.classList.add("fx-open"); document.documentElement.classList.add("fx-lock");
    root.classList.toggle("fx-hello", card);
    sky.start();
    if (!card) { go(resume(), true); return; }
    how = by; st.hi = true; if (by === "quote") st.asked = true; save();
    go("hello", true);
  }
  function close() {
    if (root.hidden) return;
    clearTimers(); token++; busy = false;
    root.hidden = true; root.classList.remove("fx-alarm", "fx-hello", "fx-dark"); document.body.classList.remove("fx-open"); document.documentElement.classList.remove("fx-lock");
    sky.stop(); view.innerHTML = ""; paintDock();
    if (lastFocus && lastFocus !== document.body && lastFocus.focus && document.body.contains(lastFocus)) focus(lastFocus);
    else focus(dock.querySelector(dock.getAttribute("data-state") === "mini" ? ".fx-dock-mini" : ".fx-dock-main"));
  }

  root.addEventListener("click", function (e) {
    var el = e.target instanceof Element ? e.target : null, hit;
    if (!el) return;
    if ((hit = el.closest("[data-v]"))) { pick(hit, e); return; }
    hit = el.closest("[data-fx]");
    if (!hit) {
      if (screen === "intro") skipIntro();
      else if (screen === "hello" && !el.closest(".fx-hi-card")) close();   /* a tap beside the card closes it */
      return;
    }
    switch (hit.getAttribute("data-fx")) {
      case "close": close(); break;
      case "start": start(); break;
      case "quote": toPrices(); break;
      case "skip": skipIntro(); break;
      case "begin": begin(); break;
      case "next": next(); break;
      case "back": back(); break;
      case "fix": fix(); break;
      case "book": go("book"); break;
      case "edit": st.i = Q.length - 1; save(); go("q"); break;
      case "day": choose(hit, "day", "data-d"); break;
      case "slot": choose(hit, "slot", "data-s"); break;
    }
  });
  view.addEventListener("submit", function (e) { e.preventDefault(); if (screen === "book") submit(e.target); });
  view.addEventListener("input", function (e) {
    var el = e.target;
    if (screen === "q" && el.classList && el.classList.contains("fx-text")) {
      var x = Q[st.i], v = F.text(el.value, x.max), label = view.querySelector(".s-name");
      if (v) st.a[x.id] = v; else delete st.a[x.id];
      if (label) label.textContent = v ? (v.length > 28 ? v.slice(0, 27) + "…" : v) : "Your business";
      var btn = view.querySelector('[data-fx="next"]');
      if (btn) btn.textContent = v ? "Continue" : "Skip";
      save();
    } else if (screen === "book" && el.form && el.name && el.name !== "website" && el.type !== "checkbox") {
      st.f[el.name] = F.text(el.value, 500); save();
    }
  });
  view.addEventListener("pointermove", function (e) {
    if (reduce || e.pointerType === "touch") return;
    var R = root.getBoundingClientRect();
    sky.aim((e.clientX - R.left) / R.width - .5, (e.clientY - R.top) / R.height - .5);
    var card = screen === "intro" ? ".fx-pass" : screen === "hello" ? ".fx-hi-card" : "", p = card ? view.querySelector(card) : null, lean = screen === "hello" ? .3 : 1;
    if (!p) return;
    var r = p.getBoundingClientRect(), px = Math.max(-.3, Math.min(1.3, (e.clientX - r.left) / r.width)), py = Math.max(-.3, Math.min(1.3, (e.clientY - r.top) / r.height));
    p.style.setProperty("--fx-ry", ((px - .5) * 12 * lean).toFixed(2) + "deg"); p.style.setProperty("--fx-rx", ((.5 - py) * 10 * lean).toFixed(2) + "deg");
    p.style.setProperty("--fx-gx", (px * 100).toFixed(1) + "%"); p.style.setProperty("--fx-gy", (py * 100).toFixed(1) + "%");
  });
  document.addEventListener("keydown", function (e) {
    if (root.hidden) return;
    var el = e.target, tag = (el && el.tagName) || "", k = e.key;
    if (k === "Escape") { e.preventDefault(); close(); return; }
    if (k === "Tab") {
      var f = [].slice.call(root.querySelectorAll('button:not([disabled]),a[href],input:not([type="hidden"]),textarea')).filter(function (n) { return n.offsetParent !== null; });
      if (!f.length) return;
      var a = document.activeElement;
      if (e.shiftKey && (a === f[0] || !root.contains(a) || a === view)) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && (a === f[f.length - 1] || !root.contains(a))) { e.preventDefault(); f[0].focus(); }
      return;
    }
    if (/^Arrow/.test(k) && el.getAttribute && /^(radio|checkbox)$/.test(el.getAttribute("role") || "")) {
      var sib = [].slice.call(el.parentNode.children), to = sib[sib.indexOf(el) + (k === "ArrowDown" || k === "ArrowRight" ? 1 : -1)];
      if (to) { e.preventDefault(); to.focus(); }
      return;
    }
    if (screen === "intro" && (k === "Enter" || k === " ") && tag !== "BUTTON") { skipIntro(); return; }
    if (screen !== "q" || e.metaKey || e.ctrlKey || e.altKey) return;
    if (tag === "INPUT") { if (k === "Enter") { e.preventDefault(); next(); } return; }
    if (/^[1-9]$/.test(k)) { var o = view.querySelectorAll(".fx-opt")[+k - 1]; if (o) { o.focus(); pick(o); } return; }
    if (k === "Enter" && tag !== "BUTTON" && tag !== "A") { e.preventDefault(); next(); }
  });
  window.addEventListener("resize", function () { if (!root.hidden) sky.fit(); });
  /* One finger on the screen moves the check when it has more to show, and never the site behind it. */
  root.addEventListener("touchmove", function (e) {
    if (e.touches.length === 1 && e.cancelable && view.scrollHeight <= view.clientHeight + 1) e.preventDefault();
  }, { passive: false });
  /* Only the middle part scrolls. If a browser nudges the frame itself (keyboard, focus), put it back. */
  root.addEventListener("scroll", function () { if (root.scrollTop || root.scrollLeft) { root.scrollTop = 0; root.scrollLeft = 0; } });

  dock.addEventListener("click", function (e) {
    var el = e.target instanceof Element ? e.target : null;
    if (!el) return;
    if (el.closest("[data-fx-min]")) { st.mini = true; save(); paintDock(); focus(dock.querySelector(".fx-dock-mini")); return; }
    if (el.closest("[data-fx-open]")) { if (st.mini) { st.mini = false; save(); } open(); }
  });
  /* Any other button on the page can open the check by carrying data-fx-open. */
  document.addEventListener("click", function (e) {
    var el = e.target instanceof Element ? e.target.closest("[data-fx-open]") : null;
    if (el && !dock.contains(el)) { e.preventDefault(); open(); }
  });
  /* Step aside while someone is filling in the quote calculator or watching the videos. */
  if ("IntersectionObserver" in window) {
    var seen = [], io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) { var k = seen.indexOf(en.target); if (en.isIntersecting && k < 0) seen.push(en.target); if (!en.isIntersecting && k >= 0) seen.splice(k, 1); });
      yielding = seen.length; paintDock();
    }, { rootMargin: "0px 0px -18% 0px" });
    [document.getElementById("quoteForm"), document.querySelector(".calc-footer"), document.getElementById("rlRow")].forEach(function (n) { if (n) io.observe(n); });
  }
  /* The site's own "Request your quote" button opens the card, once per visit. After that it goes to the calculator as before. */
  document.addEventListener("click", function (e) {
    if (!CFG.quoteOpensCard || st.done || st.asked || !root.hidden || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var a = e.target instanceof Element ? e.target.closest('a[href="#quoteForm"]') : null;
    if (!a) return;
    e.preventDefault(); e.stopPropagation();
    open("quote");
  }, true);

  /* Arriving: the big card once per visit, unless a link sent the visitor to one part of the page. */
  var where = { hash: "", phone: !!(window.matchMedia && window.matchMedia("(max-width: 760px)").matches) };
  try { where.hash = String(window.parent.location.hash || window.location.hash || "").slice(1); } catch (e) {}
  var greet = F.welcome(st, where) === "big";
  function greetNow() {
    var a = document.activeElement, typing = !!a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
    if (!root.hidden) return;
    if (st.hi || typing || document.body.classList.contains("contact-open")) { dock.hidden = false; return; }
    open("enter");
  }
  paintDock(); dock.hidden = greet; document.body.classList.add("fx-docked");
  if (greet) {
    var wait = Math.max(0, +CFG.entryDelay || 0) * 1000;
    if (document.visibilityState !== "hidden") window.setTimeout(greetNow, wait);
    else document.addEventListener("visibilitychange", function shown() {
      if (document.visibilityState === "hidden") return;
      document.removeEventListener("visibilitychange", shown);
      window.setTimeout(greetNow, wait);
    });
  }
})();
